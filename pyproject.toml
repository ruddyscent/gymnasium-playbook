[project]
name = "gymnasium-playbook"
version = "0.1.0"
description = "Reproducible Gymnasium and ALE reinforcement learning experiments"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "gymnasium[classic-control,toy-text]==1.3.0",
    "numpy==2.5.3",
]

[project.optional-dependencies]
box2d = ["gymnasium[box2d]==1.3.0"]
mujoco = ["gymnasium[mujoco]==1.3.0", "mujoco==3.12.0"]
atari = ["gymnasium[atari]==1.3.0", "ale-py==0.12.1"]

[tool.uv]
package = false
required-version = ">=0.12.10,<0.13"
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]
